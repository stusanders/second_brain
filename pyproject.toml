[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-maintained personal + team knowledge wiki (POC)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "msal>=1.31",
    "openai>=1.50",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.22",
    "azure-identity>=1.19",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends(...) in argument defaults is the intended pattern

[tool.pytest.ini_options]
asyncio_mode = "auto"
